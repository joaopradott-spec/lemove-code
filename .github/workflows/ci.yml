name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: python -m pip install -e ".[test]"
      - run: npm ci
      - run: python -m pytest -q
      - run: npm test
      - run: node test-client.js
      - run: node --check server.js

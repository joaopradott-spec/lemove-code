name: Beta Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pack source zip
        run: git archive -o lemove-code-${{ github.ref_name }}.zip HEAD

      - name: Create GitHub prerelease
        run: >
          gh release create "${{ github.ref_name }}"
          --prerelease
          --title "${{ github.ref_name }}"
          --notes "Beta do Lemove Code — terminal estilo OpenCode usando o Claude Desktop como cérebro.

Instalação: baixe o .zip abaixo, extraia e dê duplo clique em instalar.bat (precisa de Python 3.9+ e Node 18+).

Novidades desta beta: instalador completo com registro automático do MCP, ferramenta lemove_reply (resposta em 1 chamada), auto-abertura do Claude Desktop, botão Restaurar janela (Ctrl+O), botão Colar, aviso de limite de ferramentas, espera sem timeout."
          "lemove-code-${{ github.ref_name }}.zip"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

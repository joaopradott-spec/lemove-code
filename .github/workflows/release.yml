name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pack source zip
        run: git archive -o lemove-code-${{ github.ref_name }}.zip HEAD

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Pack Claude Desktop extension
        run: |
          npm ci --omit=dev
          npx -y @anthropic-ai/mcpb validate .
          npx -y @anthropic-ai/mcpb pack . lemove-code-${{ github.ref_name }}.mcpb

      - name: Write release notes
        run: |
          cat > RELEASE_NOTES.md <<'NOTES_EOF'
          Lemove Code - terminal estilo OpenCode usando o Claude Desktop como cerebro.

          Instalacao classica: baixe o .zip, extraia e de duplo clique em instalar.bat.
          Extensao MCP: instale o arquivo .mcpb pelo Claude Desktop.

          Consulte o README para configuracao, seguranca e uso.
          NOTES_EOF

      - name: Create GitHub release
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes-file RELEASE_NOTES.md "lemove-code-${{ github.ref_name }}.zip" "lemove-code-${{ github.ref_name }}.mcpb"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

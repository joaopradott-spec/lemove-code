[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lemove-code"
version = "0.4.0-beta"
description = "Terminal estilo OpenCode que usa o Claude Desktop como cérebro."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "textual>=0.60.0",
    "rich>=13.0.0",
    "pygetwindow>=0.0.9",
    "pyautogui>=0.9.54",
    "pyperclip>=1.8.2",
    "psutil>=5.9.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
lemovecode = "lemove_code.cli:main"

[tool.setuptools]
packages = ["lemove_code"]
